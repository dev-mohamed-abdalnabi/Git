name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean node_modules and Gradle cache
        run: |
          rm -rf node_modules
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper

      - name: Install dependencies
        run: npm install --no-optional

      - name: Expo prebuild (generate native android project)
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Find APK
        id: findapk
        run: |
          APK_PATH=$(find android/app/build/outputs -type f -name "*.apk" -print -quit)
          test -n "$APK_PATH" || { echo "APK not found"; find android/app/build/outputs -type f | head -50; exit 1; }
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmobile-apk
          path: ${{ steps.findapk.outputs.apk_path }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "GitMobile build #${{ github.run_number }}"
          files: ${{ steps.findapk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
